<main class="container">
  <h1>Gestor de Tareas DAW</h1>

  <p class="subtitulo">
    Arquitectura modular con Signals e Inyección de Dependencias
  </p>

  <div class="formulario">
    <input type="text" [value]="nuevaTareaInput()" (input)="actualizarTexto($event)"
      placeholder="Escribe una nueva tarea..." />

    <button type="button" (click)="agregar()">
      Añadir tarea
    </button>
  </div>

  <div class="lista">
    @for (item of listaTareas(); track $index) {
    <app-tarea-item [tarea]="item" [index]="$index" (onEliminar)="borrar($event)" />
    } @empty {
    <p class="vacio">
      No hay tareas pendientes. ¡Buen trabajo!
    </p>
    }
  </div>
</main>
