<main class="contenedor">
  <h1>Catálogo de Juegos de Mario</h1>

  <p>
    Total de juegos:
    <strong>{{ totalJuegos() }}</strong>
  </p>

  <section class="formulario">
    <h2>Añadir juego</h2>

    <input
      type="text"
      [value]="tituloInput()"
      (input)="actualizarTitulo($event)"
      placeholder="Título del juego"
    />

    <input
      type="text"
      [value]="plataformaInput()"
      (input)="actualizarPlataforma($event)"
      placeholder="Plataforma"
    />

    <input
      type="number"
      [value]="anioInput()"
      (input)="actualizarAnio($event)"
      placeholder="Año"
    />

    <input
      type="text"
      [value]="tipoInput()"
      (input)="actualizarTipo($event)"
      placeholder="Tipo de juego"
    />

    <select
      [value]="categoriaInput()"
      (change)="actualizarCategoria($event)"
    >
      <option value="Principal">Principal</option>
      <option value="Spin-off">Spin-off</option>
    </select>

    <button type="button" (click)="agregarJuego()">
      Añadir juego
    </button>
  </section>

  <section class="lista">
    <h2>Juegos disponibles</h2>

    @for (juego of juegos(); track juego.id) {
      <app-juego-item
        [juego]="juego"
        (onEliminar)="eliminarJuego($event)"
      />
    } @empty {
      <p class="vacio">
        No hay juegos en el catálogo.
      </p>
    }
  </section>
</main>
